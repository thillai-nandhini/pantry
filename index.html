<html lang="en">
<head>

<meta name="mobile-web-app-capable" content="yes">

<title>Pantry</title>
<style>
:root{
  --bg:#f5f2eb; --card:#fff; --ink:#1c2420; --mute:#7a817b; --line:#ebe7dd;
  --accent:#1f5c45; --accent2:#2c7a5d;
  --ok:#2fa36b; --low:#e08a1e; --lowbg:#fdeedb; --out:#d9453a; --outbg:#fbe9e6; --warn:#b97a10; --warnbg:#fbf0d9;
  --r:18px; --shadow:0 1px 2px rgba(28,36,32,.04),0 6px 20px rgba(28,36,32,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Noto Sans Tamil",sans-serif;touch-action:manipulation}
body{min-height:100vh;padding-top:env(safe-area-inset-top)}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
#app{max-width:560px;margin:0 auto;padding:16px 16px calc(120px + env(safe-area-inset-bottom))}
h1{font-family:ui-serif,"New York",Georgia,serif;font-size:32px;letter-spacing:-.5px;margin:6px 0 2px}
.sub0{color:var(--mute);font-size:14px;margin:0 0 16px}
.hdr{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.logo{width:44px;height:44px;border-radius:12px;flex:none;box-shadow:var(--shadow)}
.back{width:38px;height:38px;border-radius:50%;background:#fff;box-shadow:var(--shadow);font-size:24px;line-height:1;display:grid;place-items:center;flex:none;padding-bottom:3px}
.mid{flex:1;min-width:0}
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;font-size:16px;outline:none;margin-bottom:12px}
.search:focus,.in:focus{border-color:var(--accent2)}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.qa .btn{text-align:center;padding:12px 8px}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.stat4{background:var(--card);border-radius:16px;padding:11px 4px;text-align:center;box-shadow:var(--shadow)}
.stat4 b{display:block;font-size:24px;font-family:ui-serif,Georgia,serif;line-height:1.1}
.stat4 span{font-size:11px;color:var(--mute);line-height:1.2;display:block;margin-top:3px}
.stat4.low b{color:var(--low)} .stat4.soon b{color:var(--warn)} .stat4.out b{color:var(--out)}
.stat4:active{transform:scale(.97)}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 2px;background:var(--card);border-radius:22px;padding:12px 6px;box-shadow:var(--shadow);margin-bottom:14px}
.ct{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px 8px;border-radius:16px;font-size:11.5px;color:#3d4640;line-height:1.2;text-align:center;min-height:74px}
.ct span{display:block}
.ct.on{background:var(--t);font-weight:650}
.ct:active{background:#f3f0e8}
.seclabel{font-size:12.5px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.5px;margin:18px 4px 8px}
.sec{display:flex;align-items:center;gap:8px;margin:18px 4px 10px;font-weight:650;font-size:15px}
.sec small{color:var(--mute);font-weight:500}
.prow{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:var(--r);padding:11px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:#d6d1c4;display:inline-block}
.dot.ok{background:var(--ok)} .dot.low{background:var(--low)} .dot.out{background:var(--out)}
.nm{font-weight:620;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ta{font-size:12.5px;color:var(--mute);margin-top:1px}
.meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:3px;font-size:12.5px;color:var(--mute)}
.pill{padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.pill.low{background:var(--lowbg);color:#b8650c} .pill.out{background:var(--outbg);color:var(--out)} .pill.warn{background:var(--warnbg);color:var(--warn)}
.qty{display:flex;align-items:center;gap:6px;flex:none}
.q{min-width:58px;text-align:center;font-weight:650;font-size:14.5px}
.q.low{color:#b8650c} .q.out{color:var(--out)}
.rb{width:32px;height:32px;border-radius:50%;background:#f0ece2;font-size:19px;line-height:1;display:grid;place-items:center;flex:none}
.rb:active{background:#e4dfd2}
.rb.add{background:var(--accent);color:#fff}
.ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
.empty{text-align:center;color:var(--mute);padding:34px 20px;line-height:1.6}
.empty .big{font-size:44px;margin-bottom:6px}
.btn{display:inline-block;background:var(--accent);color:#fff;border-radius:14px;padding:13px 20px;font-weight:620;font-size:16px}
.btn.ghost{background:#ece7da;color:var(--ink)}
.btn.danger{background:var(--outbg);color:var(--out)}
.btn.block{display:block;width:100%;text-align:center}
.btn.sm{padding:9px 14px;font-size:14px;border-radius:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;white-space:nowrap}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:20}
.tabs{display:flex;width:100%;max-width:560px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--mute);padding:4px 0;position:relative}
.tab i{font-style:normal;font-size:21px;filter:grayscale(1);opacity:.7}
.tab.on{color:var(--accent);font-weight:650} .tab.on i{filter:none;opacity:1}
.badge{position:absolute;top:-1px;left:calc(50% + 6px);background:var(--out);color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:1px 6px}
.scrim{position:fixed;inset:0;background:rgba(20,26,22,.42);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));animation:up .22s ease-out}
.grab{width:42px;height:5px;border-radius:9px;background:#d6d1c4;margin:4px auto 14px}
.sheet h2{font-family:ui-serif,Georgia,serif;margin:0 0 4px;font-size:24px}
label.f{display:block;font-size:12.5px;color:var(--mute);margin:12px 2px 5px;font-weight:600}
.in{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px 13px;font-size:16px;outline:none;min-height:46px}
textarea.in{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rowb{display:flex;gap:10px;margin-top:18px}
.rowb .btn{flex:1;text-align:center}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.rec{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.rec:first-child{border-top:0}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin:8px 0}
.kv div{background:#f6f3ec;border-radius:12px;padding:8px 2px}
.kv b{display:block;font-size:15px} .kv span{font-size:11px;color:var(--mute)}
.hero{background:linear-gradient(145deg,var(--accent2),var(--accent));color:#fff;border-radius:24px;padding:22px;margin-bottom:16px;box-shadow:var(--shadow)}
.hero h3{margin:0 0 6px;font-family:ui-serif,Georgia,serif;font-size:22px}
.hero p{margin:0 0 16px;opacity:.9;font-size:14px;line-height:1.5}
.hero .btn{background:#fff;color:var(--accent)}
.status{padding:12px 14px;border-radius:14px;background:#fff;margin-bottom:14px;font-size:14px;color:var(--mute)}
.srow{background:#fff;border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow)}
.srow .top{display:flex;gap:10px;align-items:center}
.srow input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
.srow .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.srow .in{padding:9px 10px;font-size:15px;min-height:42px}
.hint{font-size:12px;color:var(--accent2);margin:6px 2px 0}
.tick{width:30px;height:30px;border-radius:50%;border:2px solid #cfc9b9;flex:none;display:grid;place-items:center;font-size:16px;color:#fff}
.tick.on{background:var(--accent);border-color:var(--accent)}
.sugg button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border-radius:14px;padding:10px 12px;margin-top:8px;box-shadow:var(--shadow)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.setrow select{width:auto;min-width:120px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;z-index:80;animation:fade .2s;max-width:90%;text-align:center}
.note{font-size:13px;color:var(--mute);line-height:1.55;margin:10px 2px}
.done{opacity:.5;text-decoration:line-through}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
</style>
<script src="catalog.js"></script>
</head>
<body>
<div id="app"><div id="view"></div></div>
<div class="tabbar"><div class="tabs">
  <button class="tab" data-tab="home" data-act="tab"><i>🏠</i>Home</button>
  <button class="tab" data-tab="pantry" data-act="tab"><i>📦</i>Pantry</button>
  <button class="tab" data-tab="buy" data-act="tab"><i>🛒</i>Buy List<span class="badge" id="badge" hidden></span></button>
  <button class="tab" data-tab="prices" data-act="tab"><i>💰</i>Prices</button>
  <button class="tab" data-tab="settings" data-act="tab"><i>⚙️</i>Settings</button>
</div></div>
<div id="sheetRoot"></div>
<input type="file" id="billFile" accept="image/*" hidden>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
/* =====================================================================
   Pantry: personal home grocery manager
   Layers (kept separate on purpose):
     1. Master catalog   -> catalog.js (window.CATALOG) + S.custom (your own products)
     2. User inventory   -> S.inv
     3. Buy list         -> derived from inventory + S.buy (manual extras)
     4. Purchase history -> S.purch (also drives price history)
   ===================================================================== */
const KEY='pantry.v2';
const CATA=window.CATALOG||{cats:[],subs:[],prods:[]};
const CBY={},SBY={};
CATA.cats.forEach(c=>CBY[c.id]=c);CATA.subs.forEach(s=>SBY[s.id]=s);
let S=blank(),PRODS=[],PBY={},FC={};
const ui={tab:'home',cat:null,q:'',pf:'all',scanRows:[],scanMsg:'',sheetFn:null};

/* ---------- units ---------- */
const U={kg:{f:'mass',b:1000},g:{f:'mass',b:1},l:{f:'vol',b:1000},ml:{f:'vol',b:1},pc:{f:'cnt',b:1},pack:{f:'cnt',b:1},bunch:{f:'cnt',b:1}};
const UNAME={kg:'kg',g:'g',l:'litre',ml:'ml',pc:'piece',pack:'packet',bunch:'bunch'};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>String(+(+n).toFixed(2));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);
const toBase=(v,u)=>Math.round(v*U[u].b*1000)/1000;
const norm=s=>String(s||'').toLowerCase().replace(/[^\p{L}\p{M}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();
const title=s=>s.toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase());
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const daysTo=s=>Math.round((new Date(s+'T00:00:00')-new Date(todayISO()+'T00:00:00'))/864e5);
const fmtDate=s=>s?new Date(s+'T00:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'-';
const money=n=>(S.set.cur||'$')+(+n).toFixed(2);
function fmt(unit,base){
  base=Math.max(0,base||0);const f=U[unit].f;
  if(f==='mass')return base>=1000?num(base/1000)+' kg':num(base)+' g';
  if(f==='vol')return base>=1000?num(base/1000)+' L':num(base)+' ml';
  const one={pc:'pc',pack:'packet',bunch:'bunch'}[unit],many={pc:'pcs',pack:'packets',bunch:'bunches'}[unit];
  return num(base)+' '+(base===1?one:many);
}
const stepOf=u=>U[u].f==='cnt'?1:(u==='kg'||u==='l')?500:100;
const unitOptions=(sel,fam)=>Object.keys(U).filter(u=>!fam||U[u].f===fam).map(u=>`<option value="${u}" ${u===sel?'selected':''}>${UNAME[u]}</option>`).join('');
const catOptions=sel=>CATA.cats.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.en)}</option>`).join('');
const subOptions=(cid,sel)=>CATA.subs.filter(s=>s.cat===cid).map(s=>`<option value="${s.id}" ${s.id===sel?'selected':''}>${esc(s.en)}</option>`).join('');
const dn=o=>S.set.lang==='ta'&&o.ta?{a:o.ta,b:o.en}:{a:o.en,b:o.ta||''};
const icon=(cid,sz=24)=>{const c=CBY[cid]||CATA.cats[0];if(!c)return'';return `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="${c.k}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${c.p}"/></svg>`};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)}

/* ---------- state ---------- */
function blank(){return {v:2,inv:[],buy:[],purch:[],custom:[],set:{warn:7,lang:'en',cur:'$'}}}
function fix(d){const b=blank();const s=Object.assign(b,d);s.set=Object.assign(blank().set,d.set||{});return s}
function rebuild(){PRODS=CATA.prods.concat(S.custom);PBY={};PRODS.forEach(p=>PBY[p.id]=p);FC={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save on this device')}}
function init(){
  let d=null;try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(d&&Array.isArray(d.inv)){S=fix(d);rebuild();return}
  S=blank();rebuild();
  try{const o=JSON.parse(localStorage.getItem('pantry.v1'));if(o&&Array.isArray(o.items)){migrateV1(o);save()}}catch(e){}
}
function migrateV1(o){
  rebuild();
  (o.items||[]).forEach(it=>{
    const m=matchProd(it.name);let pid=m&&m.score>=55?m.p.id:null;
    if(!pid)pid=makeCustom(it.name,'',guessCat(it.name),it.unit&&U[it.unit]?it.unit:'pc',1).id;
    const p=PBY[pid],ts=it.boughtAt||Date.now();
    S.inv.push({id:uid(),pid,brand:'',pack:'',qty:it.qty||0,orig:it.qty||0,unit:U[it.unit]?it.unit:p.u,min:it.min||0,bought:new Date(ts).toISOString().slice(0,10),expiry:'',price:0,store:'',notes:'',created:ts,updated:ts});
  });
  (o.extra||[]).filter(x=>!x.done).forEach(x=>S.buy.push({id:uid(),name:x.name}));
}

/* ---------- catalog search / matching ---------- */
function pfields(p){return FC[p.id]||(FC[p.id]=[p.en,p.ta||'',...(p.al||[])].map(norm).filter(Boolean))}
function scoreProd(p,n){
  let best=0;
  for(const f of pfields(p)){
    let s=0;
    if(f===n)s=100;else if(f.startsWith(n))s=85;else if(f.split(' ').some(w=>w.startsWith(n)))s=75;else if(f.includes(n))s=62;else if(f.length>=4&&n.includes(f))s=55+f.length/100;
    if(s>best)best=s;
  }
  if(!best){const t=n.split(' ').filter(x=>x.length>1);if(t.length>1){const all=pfields(p).join(' ');if(t.every(x=>all.includes(x)))best=45}}
  return best;
}
function matchProd(text){
  const n=norm(text);if(!n)return null;let b=null;
  for(const p of PRODS){const s=scoreProd(p,n);if(s>0&&(!b||s>b.score))b={p,score:s}}
  return b;
}
function searchProds(q){
  const n=norm(q);if(!n)return[];const sc=new Map();
  for(const p of PRODS){const s=scoreProd(p,n);if(s>0)sc.set(p.id,s)}
  CATA.cats.forEach(c=>{if(norm(c.en).includes(n)||norm(c.ta).includes(n))PRODS.forEach(p=>{if(p.cat===c.id&&!sc.has(p.id))sc.set(p.id,30)})});
  CATA.subs.forEach(s=>{if(norm(s.en).includes(n)||norm(s.ta).includes(n))PRODS.forEach(p=>{if((p.sub===s.id||(p.also||[]).includes(s.id))&&!sc.has(p.id))sc.set(p.id,30)})});
  S.inv.forEach(r=>{if(norm(r.brand).includes(n)||norm(r.store).includes(n)){if((sc.get(r.pid)||0)<50)sc.set(r.pid,50)}});
  return [...sc.entries()].filter(([id])=>PBY[id]).sort((a,b)=>b[1]-a[1]||PBY[a[0]].en.localeCompare(PBY[b[0]].en)).slice(0,80).map(([id])=>PBY[id]);
}
const GUESSES=[
 ['veg',/tomato|onion|potato|brinjal|carrot|beans|capsicum|cabbage|cauliflower|okra|bhindi|cucumber|gourd|pumpkin|garlic|ginger|chilli|chili|drumstick|beetroot|radish|peas|corn|lemon|spinach|palak|coriander|mint|keerai|coconut|leaves/i],
 ['fruits',/apple|banana|mango|orange|grape|papaya|pomegranate|guava|melon|pineapple|kiwi|pear|fruit|berry/i],
 ['dairy',/milk|curd|yogurt|yoghurt|butter|paneer|cheese|cream|dahi/i],
 ['meat',/chicken|mutton|egg|fish|prawn|crab|squid|tuna|sardine|meat/i],
 ['oils',/\boil\b|ghee/i],
 ['masala',/masala|powder|podi/i],
 ['spices',/pepper|cumin|mustard|cardamom|clove|cinnamon|spice|seeds|fennel/i],
 ['dal',/dal|dhal|lentil|chana|rajma|moong|urad|toor|gram|chickpea|beans/i],
 ['rice',/rice|atta|flour|maida|rava|sooji|wheat|poha|oats|ragi|besan|millet/i],
 ['sugar',/sugar|sweetener/i],['sweeteners',/jaggery|karupatti|palm/i],['salt',/salt/i],
 ['pickles',/pickle|achar/i],['vathal',/vathal|vadam|appalam|pappad/i],
 ['snacks',/chips|murukku|mixture|namkeen|snack|sev|pori/i],['sweets',/sweet|halwa|laddu|burfi|jamun|kesari|peda/i],
 ['nuts',/cashew|almond|pista|walnut|raisin|dates|fig|nuts/i],['bev',/\btea\b|coffee|juice|drink|horlicks|boost|bournvita|soda|cola/i],
 ['bakery',/bread|bun|biscuit|cookie|cake|rusk|jam|honey|spread|pav/i],['baking',/baking|yeast|cocoa|custard|essence|icing|sprinkle|gelatin/i],
 ['frozen',/frozen/i],['rtc',/batter|mix\b|ready/i],['instant',/noodle|maggi|pasta|vermicelli|soup/i],
 ['pooja',/camphor|incense|kumkum|wick|pooja|agarbatti/i],
 ['house',/soap|detergent|shampoo|toothpaste|brush|cleaner|dish|wash|tissue|wipe|foil|bag|diaper|sanitary|lotion|sanitizer|conditioner|softener|towel/i],
 ['disposable',/disposable|plate|cup|spoon|container/i]
];
function guessCat(name){for(const [c,r] of GUESSES)if(r.test(name))return c;return 'instant'}
function makeCustom(en,ta,cat,unit,min,sub){
  const subId=sub||(CATA.subs.find(s=>s.cat===cat)||{}).id;
  const p={id:'c_'+uid(),cat,sub:subId,en:title(en.trim()),ta:(ta||'').trim(),al:[],u:unit,m:min,custom:true};
  S.custom.push(p);rebuild();save();return p;
}

/* ---------- stock logic ---------- */
function stock(pid){
  const rs=S.inv.filter(r=>r.pid===pid);if(!rs.length)return null;
  const unit=rs[0].unit,fam=U[unit].f;let qty=0,min=0,exp=null,age=null;
  for(const r of rs){
    if(U[r.unit].f!==fam)continue;qty+=r.qty;min=Math.max(min,r.min);
    if(r.qty>0){
      if(r.expiry){const d=daysTo(r.expiry);if(exp===null||d<exp)exp=d}
      if(r.bought){const a=-daysTo(r.bought);if(age===null||a>age)age=a}
    }
  }
  const p=PBY[pid],sub=p&&SBY[p.sub],fd=sub&&sub.f;
  const st=qty<=0?'out':qty<=min?'low':'ok';
  let soon=false,note='';
  if(qty>0){
    if(exp!==null){if(exp<0){soon=true;note='Expired'}else if(exp<=S.set.warn){soon=true;note=exp===0?'Expires today':'Expires in '+exp+'d'}}
    else if(fd&&age!==null&&age>=fd-1){soon=true;note=(age<=0?'Bought today':age+'d old')+' · use soon'}
  }
  return {pid,rs,unit,qty,min,st,soon,note,exp};
}
function trackedStock(){return [...new Set(S.inv.map(r=>r.pid))].filter(id=>PBY[id]).map(stock)}
function stats(){const sk=trackedStock();return {sk,items:sk.length,low:sk.filter(s=>s.st==='low').length,out:sk.filter(s=>s.st==='out').length,soon:sk.filter(s=>s.soon).length}}
function buyAuto(){const sk=trackedStock();return {out:sk.filter(s=>s.st==='out'),low:sk.filter(s=>s.st==='low')}}
function buyCount(){const a=buyAuto();return a.out.length+a.low.length+S.buy.length}
function adjust(rid,dir){
  const r=S.inv.find(x=>x.id===rid);if(!r)return;
  const was=stock(r.pid).st;
  r.qty=Math.max(0,Math.round((r.qty+dir*stepOf(r.unit))*1000)/1000);r.updated=Date.now();save();
  const s=stock(r.pid),n=dn(PBY[r.pid]).a;
  if(s.st==='out'&&was!=='out')toast(n+' finished. Added to Buy List');
  else if(s.st==='low'&&was==='ok')toast(n+' is running low. Added to Buy List');
  refresh();
}
function refresh(){render();if(ui.sheetFn&&$('#sheetRoot').innerHTML)ui.sheetFn()}

function prow(p){
  const sk=stock(p.id),d=dn(p);let tags='',right='';
  if(sk){
    if(sk.st==='out')tags+='<span class="pill out">FINISHED</span>';else if(sk.st==='low')tags+='<span class="pill low">LOW</span>';
    if(sk.soon)tags+=`<span class="pill warn">${esc(sk.note)}</span>`;
    const one=sk.rs.length===1&&sk.rs[0];
    right=`<div class="qty">${one?`<button class="rb" data-act="dec" data-id="${one.id}" aria-label="Less">−</button>`:''}<div class="q ${sk.st!=='ok'?sk.st:''}">${fmt(sk.unit,sk.qty)}</div>${one?`<button class="rb" data-act="inc" data-id="${one.id}" aria-label="More">+</button>`:''}</div>`;
  }else right=`<button class="rb add" data-act="addprod" data-id="${p.id}" aria-label="Add to pantry">+</button>`;
  const sub=(d.b?`<span>${esc(d.b)}</span>`:'');
  return `<div class="prow" data-act="prod" data-id="${p.id}"><span class="dot ${sk?sk.st:''}"></span><div class="mid"><div class="nm">${esc(d.a)}</div>${sub||tags?`<div class="meta">${sub}${tags}</div>`:''}</div>${right}</div>`;
}

function priceStats(pid){
  const ps=S.purch.filter(x=>x.pid===pid&&x.price>0);if(!ps.length)return null;
  const sorted=ps.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
  const v=ps.map(x=>x.price);
  return {latest:sorted[0],min:Math.min(...v),max:Math.max(...v),avg:v.reduce((a,b)=>a+b,0)/v.length,n:ps.length};
}
function pricesView(){
  const pids=[...new Set(S.purch.map(x=>x.pid))].filter(id=>PBY[id]);
  let h=`<h1>Prices</h1><p class="sub0">Purchase and price history</p>`;

  const need=Math.max(min*2-have,stepOf(unit));const last=sk?sk.rs[sk.rs.length-1]:null;
  openSheet(`<h2>Purchased ${esc(dn(p).a)}</h2><p class="note" style="margin-top:2px">This adds it to your pantry and saves the price.</p>${storesList()}
  <div class="row2"><div><label class="f">Quantity bought</label><input id="b_qty" class="in" type="number" inputmode="decimal" step="any" value="${num(fam==='cnt'?Math.ceil(need):need/b)}"></div><div><label class="f">Unit</label><select id="b_unit" class="in">${unitOptions(unit,fam)}</select></div></div>
  <div class="row2"><div><label class="f">Price paid</label><input id="b_price" class="in" type="number" inputmode="decimal" step="any" placeholder="0.00"></div><div><label class="f">Store</label><input id="b_store" class="in" list="stores" value="${esc(last?last.store:'')}" autocomplete="off"></div></div>
  <div class="row2"><div><label class="f">Expiry date</label><input id="b_exp" class="in" type="date"></div><div><label class="f">Brand</label><input id="b_brand" class="in" value="${esc(last?last.brand:'')}" autocomplete="off"></div></div>
  <div class="rowb"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="confirmbuy" data-pid="${pid}" data-eid="${eid||''}">Add to pantry</button></div>`);
}

/* ---------- adding stock ---------- */
function addStock(pid,baseQty,o){
  o=o||{};const p=PBY[pid];
  const sk=stock(pid);let r=null;
  if(sk){r=sk.rs.find(x=>U[x.unit].f===U[o.unit||sk.unit].f&&(o.brand?x.brand===o.brand:true))||sk.rs.find(x=>U[x.unit].f===U[o.unit||sk.unit].f)||null}
  const now=Date.now();
  if(r){
    r.qty=Math.round((r.qty+baseQty)*1000)/1000;r.orig=Math.max(r.orig||0,r.qty);r.bought=o.date||todayISO();
    if(o.expiry)r.expiry=o.expiry;if(o.price>0)r.price=o.price;if(o.store)r.store=o.store;if(o.brand)r.brand=o.brand;r.updated=now;
  }else{
    S.inv.push({id:uid(),pid,brand:o.brand||'',pack:'',qty:baseQty,orig:baseQty,unit:o.unit||p.u,min:o.min!=null?o.min:toBase(p.m,p.u),bought:o.date||todayISO(),expiry:o.expiry||'',price:o.price||0,store:o.store||'',notes:'',created:now,updated:now});
  }
  if(!o.noPurchase)S.purch.push({id:uid(),pid,brand:o.brand||'',store:o.store||'',qty:baseQty,unit:o.unit||(r?r.unit:p.u),price:o.price||0,date:o.date||todayISO()});
  save();
}

/* ---------- actions ---------- */
function act(a,d,el,e){
  switch(a){
    case 'close':if(e.target===el)closeSheet();break;
    case 'tab':ui.tab=d.tab;if(d.tab==='home'&&e)ui.cat=null;ui.q=d.tab==='home'?ui.q:'';render();window.scrollTo(0,0);break;
    case 'cat':ui.cat=d.id;render();window.scrollTo(0,0);break;
    case 'back':if(ui.tab==='scan'){ui.tab='home'}else ui.cat=null;render();window.scrollTo(0,0);break;
    case 'stat':ui.pf=d.f;ui.tab='pantry';render();window.scrollTo(0,0);break;
    case 'pf':ui.pf=d.f;render();break;
    case 'add':pickerSheet();break;
    case 'pickprod':case 'addprod':closeSheet();recSheet(null,d.id);break;
    case 'prod':prodSheet(d.id);break;
    case 'newprod':newProdSheet(d.name||'',d.cat||'');break;
    case 'saveprod':{
      const en=$('#np_en').value.trim();if(!en){toast('Enter a name');break}
      const m=parseFloat($('#np_min').value);const p=makeCustom(en,$('#np_ta').value,$('#np_cat').value,$('#np_unit').value,m>=0?m:1,$('#np_sub').value);
      closeSheet();recSheet(null,p.id);toast('Product saved to your catalog');render();break}
    case 'inc':adjust(d.id,1);break;
    case 'dec':adjust(d.id,-1);break;
    case 'editrec':recSheet(d.id);break;
    case 'saverec':{
      const unit=$('#r_unit').value,q=parseFloat($('#r_qty').value),min=parseFloat($('#r_min').value);
      if(!(q>=0)){toast('Enter a valid quantity');break}
      const pr=parseFloat($('#r_price').value)||0,bought=$('#r_bought').value||todayISO(),expiry=$('#r_exp').value;
      if(expiry&&bought&&expiry<bought){toast('Expiry is before the purchase date');break}
      const f={brand:$('#r_brand').value.trim(),pack:$('#r_pack').value.trim(),unit,qty:toBase(q,unit),min:toBase(min>=0?min:0,unit),bought,expiry,price:pr,store:$('#r_store').value.trim(),notes:$('#r_notes').value.trim()};
      let pid=d.pid;
      if(d.id){const r=S.inv.find(x=>x.id===d.id);pid=r.pid;const old=r.qty;Object.assign(r,f);r.orig=Math.max(r.orig||0,r.qty);r.updated=Date.now();save();}
      else{
        const now=Date.now();S.inv.push(Object.assign({id:uid(),pid,orig:f.qty,created:now,updated:now},f));
        S.purch.push({id:uid(),pid,brand:f.brand,store:f.store,qty:f.qty,unit,price:pr,date:bought});save();
      }
      const s=stock(pid);if(s.st==='out')toast('Saved. It will appear in the Buy List');else if(s.st==='low')toast('Saved. Running low, added to Buy List');
      render();prodSheet(pid);break}
    case 'delrec':{
      if(!confirm('Delete this stock record?'))break;
      const r=S.inv.find(x=>x.id===d.id);const pid=r.pid;S.inv=S.inv.filter(x=>x.id!==d.id);save();render();
      if(S.inv.some(x=>x.pid===pid))prodSheet(pid);else closeSheet();break}
    case 'buy':
      if(d.pid)buySheet(d.pid,d.eid);
      else{S.buy=S.buy.filter(x=>x.id!==d.eid);save();render();toast('Done')}
      break;
    case 'confirmbuy':{
      const v=parseFloat($('#b_qty').value);if(!(v>0)){toast('Enter the quantity bought');break}
      const unit=$('#b_unit').value,exp=$('#b_exp').value;
      if(exp&&exp<todayISO()){toast('That expiry date is in the past');break}
      addStock(d.pid,toBase(v,unit),{unit,price:parseFloat($('#b_price').value)||0,store:$('#b_store').value.trim(),expiry:exp,brand:$('#b_brand').value.trim()});
      if(d.eid){S.buy=S.buy.filter(x=>x.id!==d.eid);save()}
      closeSheet();render();toast(dn(PBY[d.pid]).a+' added to pantry');break}
    case 'badd':{
      const i=$('#bin');const v=i.value.trim();if(!v)break;
      const m=matchProd(v);const pid=m&&m.score>=62?m.p.id:null;
      const auto=buyAuto();
      if(pid&&(auto.out.concat(auto.low).some(s=>s.pid===pid)||S.buy.some(x=>x.pid===pid))){toast('Already on your Buy List');break}
      S.buy.push({id:uid(),pid,name:pid?dn(PBY[pid]).a:title(v)});save();render();break}
    case 'bdel':S.buy=S.buy.filter(x=>x.id!==d.eid);save();render();break;
    case 'scan':ui.tab='scan';render();window.scrollTo(0,0);break;
    case 'scanpick':$('#billFile').click();break;
    case 'rowdel':ui.scanRows.splice(+d.i,1);render();break;
    case 'scanadd':{
      const store=($('#scanStore')||{}).value||'';let n=0;
      for(const r of ui.scanRows){
        if(!r.on||!r.name.trim()||!(r.qty>0))continue;
        let pid=r.pid;if(!pid)pid=makeCustom(r.name,'',r.cat||guessCat(r.name),r.unit,1).id;
        addStock(pid,toBase(r.qty,r.unit),{unit:r.unit,store:store.trim()});n++;
      }
      if(!n){toast('Nothing selected');break}
      ui.scanRows=[];ui.scanMsg='';ui.tab='pantry';ui.pf='all';render();toast(n+' item'+(n>1?'s':'')+' added to pantry');break}
    case 'delcustom':{
      if(S.inv.some(r=>r.pid===d.id)){toast('Remove its stock first');break}
      if(!confirm('Delete this product?'))break;
      S.custom=S.custom.filter(p=>p.id!==d.id);rebuild();save();render();break}
    case 'export':{
      const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const u=URL.createObjectURL(b);
      const l=document.createElement('a');l.href=u;l.download='pantry-backup.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);break}
    case 'importpick':$('#importFile').click();break;
    case 'reset':if(confirm('Erase all your pantry data on this phone? Download a backup first if unsure.')){S=blank();rebuild();save();ui.cat=null;render()}break;
  }
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el)act(el.dataset.act,el.dataset,el,e)});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){ui.q=t.value;$('#homeBody').innerHTML=homeBody();return}
  if(t.id==='pk'){$('#sugg').innerHTML=suggHtml(t.value);return}
  if(t.dataset&&t.dataset.row!==undefined&&t.dataset.f!=='name'){
    const r=ui.scanRows[+t.dataset.row];if(!r)return;const f=t.dataset.f;
    if(f==='on')r.on=t.checked;else if(f==='qty')r.qty=parseFloat(t.value)||0;
  }else if(t.dataset&&t.dataset.row!==undefined){const r=ui.scanRows[+t.dataset.row];if(r)r.name=t.value}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='set_warn'){S.set.warn=+t.value;save();render()}
  else if(t.id==='set_lang'){S.set.lang=t.value;save();render()}
  else if(t.id==='set_cur'){S.set.cur=t.value||'$';save()}
  else if(t.id==='np_cat'){$('#np_sub').innerHTML=subOptions(t.value)}
  else if(t.dataset&&t.dataset.row!==undefined){
    const r=ui.scanRows[+t.dataset.row];if(!r)return;const f=t.dataset.f;
    if(f==='on')r.on=t.checked;
    else if(f==='name'){r.name=t.value;const m=matchProd(t.value);r.pid=m&&m.score>=55?m.p.id:null;if(!r.pid)r.cat=guessCat(t.value);render()}
    else{r[f]=t.value}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='bin')act('badd',{})});
$('#importFile').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const d=JSON.parse(await f.text());
    if(d&&Array.isArray(d.inv)){S=fix(d);rebuild();save()}
    else if(d&&Array.isArray(d.items)){S=blank();rebuild();migrateV1(d);save()}
    else throw 0;
    closeSheet();render();toast('Backup restored');
  }catch(_){toast('That file is not a valid backup')}
});

/* ---------- bill scan ---------- */
function scanView(){
  let h=`<div class="hdr"><button class="back" data-act="back" aria-label="Back">‹</button><div class="mid"><h1 style="margin:0;font-size:26px">Scan bill</h1><div class="ta">Photo of a bill → items added to your pantry</div></div></div>
  <div class="hero"><h3>Take a photo of your bill</h3><p>The text is read on your phone and matched to your catalog. You can fix any line before it is added. Needs internet the first time.</p><button class="btn" data-act="scanpick">📷 Take / choose photo</button></div>
  <div class="status" id="scanmsg" ${ui.scanMsg?'':'hidden'}>${esc(ui.scanMsg)}</div>`;
  if(ui.scanRows.length){
    h+=`<label class="f">Store (optional, saved with the purchase)</label><input id="scanStore" class="in" list="stores" autocomplete="off" style="margin-bottom:8px">${storesList()}`;
    h+=`<div class="seclabel">Check the items · ${ui.scanRows.filter(r=>r.on).length} selected</div>`;
    h+=ui.scanRows.map((r,i)=>{
      const p=r.pid&&PBY[r.pid];
      return `<div class="srow"><div class="top"><input type="checkbox" data-row="${i}" data-f="on" ${r.on?'checked':''}><input class="in" data-row="${i}" data-f="name" value="${esc(r.name)}"><button class="rb" data-act="rowdel" data-i="${i}" aria-label="Remove">×</button></div>
      <div class="grid"><input class="in" type="number" inputmode="decimal" step="any" data-row="${i}" data-f="qty" value="${r.qty}"><select class="in" data-row="${i}" data-f="unit">${unitOptions(r.unit)}</select></div>
      ${p?`<div class="hint">Matched: ${esc(dn(p).a)} · ${esc(CBY[p.cat].en)}</div>`:`<div class="hint" style="color:var(--mute)">New product. Category:</div><select class="in" style="margin-top:4px" data-row="${i}" data-f="cat">${catOptions(r.cat)}</select>`}</div>`;
    }).join('');
    h+=`<button class="btn block" data-act="scanadd" style="margin-top:6px">Add selected to pantry</button>`;
  }
  return h;
}
const SKIP=/total|subtotal|gst|cgst|sgst|igst|\btax|amount|cash|change|invoice|\bbill|date|time|thank|visit|phone|mobile|\btel\b|www|\.com|discount|round|\bmrp|\bqty|\brate|price|saving|card|\bupi|paid|balance|store|supermarket|address|gstin|cashier|receipt|\bhsn|item name|description/i;
function parseLine(raw){
  let t=raw.replace(/[|_~=*•]/g,' ').replace(/\s+/g,' ').trim();
  if(t.length<3||SKIP.test(t)||!/[a-z]{3}/i.test(t))return null;
  t=t.replace(/^\s*\d{1,2}[.)\s]+(?=[a-z])/i,'').replace(/\b\d{6,}\b/g,'').trim();
  t=t.replace(/(\s+[\d.,]+)+\s*$/,'').trim();
  let unit='pc',qty=1,m;
  m=t.match(/(\d+(?:\.\d+)?)\s*(kgs?|gms?|grams?|g|ml|ltrs?|litres?|liters?|l)\b/i);
  if(m){
    const u=m[2].toLowerCase();
    unit=/^kg/.test(u)?'kg':/^(g|gm|gms|gram|grams)$/.test(u)?'g':u==='ml'?'ml':'l';
    qty=parseFloat(m[1]);t=t.replace(m[0],' ');
  }else if((m=t.match(/\b(\d+)\s*(pcs?|nos?|packets?|pkts?)\b/i))){
    qty=parseInt(m[1]);unit=/^p[ck]/i.test(m[2])&&!/^pcs?$/i.test(m[2])?'pack':'pc';t=t.replace(m[0],' ');
  }
  t=t.replace(/(\s+[\d.,]+)+\s*$/,'').replace(/[^a-z0-9 &'-]/gi,' ').replace(/\s+/g,' ').trim();
  if(t.length<3)return null;
  if(unit==='pc'&&/packet|pack/i.test(raw))unit='pack';
  const mt=matchProd(t),pid=mt&&mt.score>=55?mt.p.id:null;
  if(pid&&unit==='pc'&&qty===1)unit=PBY[pid].u;
  return {on:true,name:title(t),qty,unit,pid,cat:pid?PBY[pid].cat:guessCat(t)};
}
function loadTess(){return new Promise((res,rej)=>{if(window.Tesseract)return res();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=res;s.onerror=()=>rej(new Error('offline'));document.head.appendChild(s)})}
async function prep(file){
  const url=URL.createObjectURL(file);const img=new Image();img.src=url;await img.decode();
  const s=Math.min(1,1800/Math.max(img.width,img.height));const c=document.createElement('canvas');
  c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
  const x=c.getContext('2d');try{x.filter='grayscale(1) contrast(1.35)'}catch(_){}
  x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);return c;
}
$('#billFile').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const say=m=>{ui.scanMsg=m;const el=$('#scanmsg');if(el){el.hidden=!m;el.textContent=m}};
  ui.scanRows=[];render();say('Preparing photo…');
  try{
    const canvas=await prep(f);say('Loading reader… (first time needs internet)');await loadTess();
    const {data}=await Tesseract.recognize(canvas,'eng',{logger:m=>{if(m.status==='recognizing text')say('Reading bill… '+Math.round(m.progress*100)+'%')}});
    const rows=[],seen=new Set();
    for(const line of data.text.split('\n')){const r=parseLine(line);if(r&&!seen.has(norm(r.name))){seen.add(norm(r.name));rows.push(r)}}
    ui.scanRows=rows;
    ui.scanMsg=rows.length?'Found '+rows.length+' possible items. Fix anything that looks wrong and untick what you don’t want.':'Could not find items. Try a clearer, well-lit, flat photo of the bill.';
  }catch(err){ui.scanMsg='Could not read the bill. Check your internet connection and try again.'}
  render();
});

/* ---------- offline support ---------- */
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}

init();
render();
</script>
